<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador UC3M C2</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8fb;color:#18324b}
    .wrap{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:620px;background:white;border:1px solid #dbe4ef;border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(23,50,75,.08)}
    h1{font-size:22px;margin:0 0 10px}
    p{line-height:1.5;margin:8px 0;color:#5d6f82}
    .dot{width:34px;height:34px;border:4px solid #dbe4ef;border-top-color:#1f6fb2;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .error{color:#a12626;font-weight:600}
    button{border:0;border-radius:9px;padding:11px 15px;background:#0b4f93;color:white;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap"><div class="card" id="card">
    <div class="dot"></div>
    <h1>Simulador UC3M C2</h1>
    <p>Cargando la versión vigente…</p>
  </div></div>
<script>
(async()=>{
  const RAW='https://lhbykobrogjdboxcqwzi.supabase.co/functions/v1/simulador-uc3m-raw';
  try{
    const r=await fetch(RAW+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    if(!/<!doctype html/i.test(html) || !/Simulador UC3M C2/i.test(html)) throw new Error('Respuesta no válida');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('card').innerHTML='<h1>No se ha podido cargar el simulador</h1><p class="error">'+String(e.message||e)+'</p><p>Recarga la página. Si continúa, el simulador puede estar actualizándose.</p><button onclick="location.reload()">Reintentar</button>';
  }
})();
</script>
</body>
</html>
